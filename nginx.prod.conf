# ============================================================================
# NGINX PRODUCTION CONFIGURATION
# High-performance, secure nginx configuration for production
# ============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ============================================================================
  # LOGGING
  # ============================================================================

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main buffer=32k flush=5s;

  # ============================================================================
  # PERFORMANCE
  # ============================================================================

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 100;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  # Timeouts
  client_body_timeout 12;
  client_header_timeout 12;
  send_timeout 10;

  # ============================================================================
  # COMPRESSION
  # ============================================================================

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript text/xml application/json application/javascript application/xml+rss;
  gzip_disable "msie6";

  # ============================================================================
  # UPSTREAM BACKENDS
  # ============================================================================

  upstream backend {
    least_conn;
    server backend:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  upstream frontend {
    server frontend:3000;
    keepalive 32;
  }

  # ============================================================================
  # RATE LIMITING
  # ============================================================================

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=100r/s;

  # ============================================================================
  # CACHING
  # ============================================================================

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:50m max_size=500m inactive=30d use_temp_path=off;

  # ============================================================================
  # SECURITY HEADERS
  # ============================================================================

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;

  # ============================================================================
  # MAIN SERVER BLOCK
  # ============================================================================

  server {
    listen 80;
    listen [::]:80;
    server_name agent-audit.dev www.agent-audit.dev;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent-audit.dev www.agent-audit.dev;

    # SSL Configuration
    ssl_certificate /etc/nginx/certificates/agent-audit.crt;
    ssl_certificate_key /etc/nginx/certificates/agent-audit.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ========================================================================
    # STATIC FILES
    # ========================================================================

    location ~* ^.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";

      # Cache static assets
      proxy_cache static_cache;
      proxy_cache_valid 200 30d;
      proxy_cache_valid any 1m;
      add_header Cache-Control "public, immutable";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # ========================================================================
    # API ENDPOINTS
    # ========================================================================

    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;

      # Timeouts for API calls
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      # Buffering
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;

      # Caching
      proxy_cache api_cache;
      proxy_cache_valid 200 5m;
      proxy_cache_valid 404 1m;
      proxy_cache_bypass $http_cache_control;
      add_header X-Cache-Status $upstream_cache_status;
    }

    # ========================================================================
    # WEBSOCKET
    # ========================================================================

    location /ws {
      limit_req zone=ws_limit burst=100 nodelay;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket timeouts
      proxy_read_timeout 86400;
      proxy_send_timeout 86400;
    }

    # ========================================================================
    # HEALTH CHECK
    # ========================================================================

    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # ========================================================================
    # FRONTEND SPA FALLBACK
    # ========================================================================

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # SPA routing
      error_page 404 =200 /index.html;
    }

    # ========================================================================
    # DENY ACCESS TO SENSITIVE FILES
    # ========================================================================

    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    location ~ ~$ {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}
